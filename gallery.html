<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - Assignment 2</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <a class="logo" href="index.html">My Website</a>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="layout.html">Layout</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Image Gallery</h1>
    <p>Hover over a photo or use Tab to see its caption.</p>
    <section class="gallery">
      <figure class="photo" id="photo-1" tabindex="0">
        <img src="images/forest-coast.jpg" alt="Evergreen forest beside blue water with distant mountains.">
        <figcaption>Forest</figcaption>
      </figure>
      <figure class="photo" id="photo-2" tabindex="0">
        <img src="images/forest-waterfall.jpg" alt="A tall, narrow waterfall drops into a rocky stream surrounded by forest.">
        <figcaption>Waterfall</figcaption>
      </figure>
      <figure class="photo" id="photo-3" tabindex="0">
        <img src="images/green-valley.jpg" alt="Bright green trees frame a rocky stream beneath a partly cloudy sky.">
        <figcaption>Green valley</figcaption>
      </figure>
      <figure class="photo" id="photo-4" tabindex="0">
        <img src="images/snowy-mountains.jpg" alt="Snow-covered peaks rise on both sides of a deep mountain valley.">
        <figcaption>Mountains</figcaption>
      </figure>
      <figure class="photo" id="photo-5" tabindex="0">
        <img src="images/city-bridge.jpg" alt="A black-and-white photograph of an illuminated suspension bridge and city skyline at night.">
        <figcaption>City at night</figcaption>
      </figure>
      <figure class="photo" id="photo-6" tabindex="0">
        <img src="images/coastal-village.jpg" alt="White hillside buildings and a windmill overlook a calm blue sea.">
        <figcaption>Village</figcaption>
      </figure>
      <figure class="photo" id="photo-7" tabindex="0">
        <img src="images/lighthouse.jpg" alt="A black-and-white photograph of a small lighthouse on a rocky shore beneath textured clouds.">
        <figcaption>Lighthouse</figcaption>
      </figure>
      <figure class="photo" id="photo-8" tabindex="0">
        <img src="images/canal-town.jpg" alt="Colorful buildings and moored boats line a narrow canal in sunlight.">
        <figcaption>Canal town</figcaption>
      </figure>
      <figure class="photo" id="photo-9" tabindex="0">
        <img src="images/blue-fjord.jpg" alt="A deep blue fjord winds between steep rocky cliffs under a blue sky.">
        <figcaption>Fjord</figcaption>
      </figure>
    </section>
  </main>

  <footer>Yerali Karkinbayev, IT-2501</footer>
</body>
</html>
